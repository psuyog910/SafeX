{% extends "base.html" %}
{% block title %}{{ password.name }} - SafeX{% endblock %}
{% block content %}
<div class="narrow">
  <div class="card">
    <div class="card-head">
      <span class="card-icon"><svg width="21" height="21"><use href="#i-check-circle"/></svg></span>
      <div>
        <h2>{{ password.name }}</h2>
        <p class="sub">Decrypted. Copy it somewhere safe.</p>
      </div>
    </div>

    <div class="card-body">
      <div class="secret">
        <code id="password-text">{{ decrypted }}</code>
        <button type="button" class="copy-btn" id="copy-btn" aria-label="Copy password to clipboard" title="Copy">
          <svg width="18" height="18"><use href="#i-copy"/></svg>
        </button>
      </div>
      <p class="hint">This page is not cached. It will clear the moment you navigate away.</p>

      <div class="btn-row">
        <a href="{{ url_for('dashboard') }}" class="btn btn-ghost" style="flex:1">
          <svg width="18" height="18"><use href="#i-arrow-left"/></svg> Back to vault
        </a>
        <a href="{{ url_for('update_password', id=password.id) }}" class="btn btn-outline">
          <svg width="18" height="18"><use href="#i-edit"/></svg> Update
        </a>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var btn = document.getElementById('copy-btn');
  var text = document.getElementById('password-text');
  if(!btn || !text) return;
  btn.addEventListener('click', function(){
    var val = text.textContent;
    var done = function(){
      btn.classList.add('done');
      btn.innerHTML = '<svg width="18" height="18"><use href="#i-check"/></svg>';
      setTimeout(function(){
        btn.classList.remove('done');
        btn.innerHTML = '<svg width="18" height="18"><use href="#i-copy"/></svg>';
      }, 1800);
    };
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(val).then(done, function(){ fallback(val, done); });
    } else {
      fallback(val, done);
    }
  });
  function fallback(val, cb){
    var ta = document.createElement('textarea');
    ta.value = val;
    ta.setAttribute('readonly','');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); cb(); } catch(e){}
    document.body.removeChild(ta);
  }
})();
</script>
{% endblock %}
