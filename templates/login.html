{% extends "base.html" %}
{% block title %}Sign in - SafeX{% endblock %}
{% block content %}
<div class="narrow">
  <div class="card">
    <div class="card-head">
      <span class="card-icon"><svg width="21" height="21"><use href="#i-user"/></svg></span>
      <div>
        <h2>Welcome back</h2>
        <p class="sub">Sign in to open your vault.</p>
      </div>
    </div>

    <div class="card-body">
      <form method="POST" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <button type="button" class="toggle-pw" data-toggle-pw="password" aria-label="Show password">
              <svg width="19" height="19"><use href="#i-eye"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">
          <svg width="18" height="18"><use href="#i-unlock"/></svg> Sign in
        </button>
      </form>
    </div>
  </div>

  <p class="foot-alt">No account yet? <a href="{{ url_for('signup') }}">Create one</a></p>
</div>
{% endblock %}
