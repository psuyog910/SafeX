{% extends "base.html" %}
{% block title %}Update {{ password.name }} - SafeX{% endblock %}
{% block content %}
<div class="narrow">
  <div class="card">
    <div class="card-head">
      <span class="card-icon cyan"><svg width="21" height="21"><use href="#i-edit"/></svg></span>
      <div>
        <h2>Update entry</h2>
        <p class="sub">Currently <strong>{{ password.name }}</strong>. Saving re-encrypts with a new salt.</p>
      </div>
    </div>

    <div class="card-body">
      <form method="POST">
        <div class="field">
          <label for="password_name">Label</label>
          <input type="text" id="password_name" name="password_name" value="{{ password.name }}" required autofocus>
        </div>
        <div class="field">
          <label for="password">New password</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" placeholder="The replacement secret" autocomplete="off" required>
            <button type="button" class="toggle-pw" data-toggle-pw="password" aria-label="Show password">
              <svg width="19" height="19"><use href="#i-eye"/></svg>
            </button>
          </div>
        </div>
        <div class="field">
          <label for="passkey">Passkey to encrypt with</label>
          <div class="input-wrap">
            <input type="password" id="passkey" name="passkey" placeholder="You can reuse or change it" autocomplete="off" required>
            <button type="button" class="toggle-pw" data-toggle-pw="passkey" aria-label="Show passkey">
              <svg width="19" height="19"><use href="#i-eye"/></svg>
            </button>
          </div>
          <p class="hint">This becomes the passkey for the updated entry. The old one stops working.</p>
        </div>
        <div class="btn-row">
          <button type="submit" class="btn btn-primary" style="flex:1">
            <svg width="18" height="18"><use href="#i-check"/></svg> Save changes
          </button>
          <a href="{{ url_for('dashboard') }}" class="btn btn-outline">
            <svg width="18" height="18"><use href="#i-arrow-left"/></svg> Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
