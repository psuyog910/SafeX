{% extends "base.html" %}
{% block title %}Two-factor - SafeX{% endblock %}
{% block content %}
<div class="narrow">
  <div class="card">
    <div class="card-head">
      <span class="card-icon"><svg width="21" height="21"><use href="#i-shield"/></svg></span>
      <div>
        <h2>Two-factor check</h2>
        <p class="sub">Enter the 6-digit code from your authenticator.</p>
      </div>
    </div>

    <div class="card-body">
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
          <label for="code">Authentication code</label>
          <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code"
                 placeholder="000000 or a recovery code" maxlength="20" required autofocus>
          <p class="hint">Lost your phone? Enter one of your recovery codes instead.</p>
        </div>
        <button type="submit" class="btn btn-primary btn-block">
          <svg width="18" height="18"><use href="#i-unlock"/></svg> Verify and sign in
        </button>
      </form>
      <p class="foot-alt"><a href="{{ url_for('login') }}">Back to sign in</a></p>
    </div>
  </div>
</div>
{% endblock %}
